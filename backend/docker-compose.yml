# Local MongoDB for development (no Atlas required)
# From backend/:  docker compose up -d
# Then in .env:    MONGODB_URI=mongodb://127.0.0.1:27017/openhousecafe

services:
  mongo:
    image: mongo:7
    container_name: lumina-mongo
    ports:
      - '27017:27017'
    volumes:
      - lumina_mongo_data:/data/db
    restart: unless-stopped

volumes:
  lumina_mongo_data:
