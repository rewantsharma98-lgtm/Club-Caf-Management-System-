version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: ohc-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  api:
    build: ./backend
    container_name: ohc-api
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/openhousecafe
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb

  web:
    build: ./frontend
    container_name: ohc-web
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - api

volumes:
  mongo_data:
